name: ABEST WMS CI Pipeline

"on":
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    name: CI Pipeline (Lint, Typecheck, DB Tests, Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wms_admin
          POSTGRES_PASSWORD: wms_secret_pass
          POSTGRES_DB: abest_wms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: abest_wms
      DB_USER: wms_admin
      DB_PASSWORD: wms_secret_pass
      DATABASE_URL: postgresql+psycopg://wms_admin:wms_secret_pass@localhost:5432/abest_wms
      JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-at-least-32-chars-long
      SECRET_KEY: test-secret-key-for-ci-pipeline-at-least-32-chars-long
      ENV: test
      DEBUG: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install -r client/requirements.txt

      - name: Check code formatting (Black)
        run: black --check .

      - name: Lint code (Ruff)
        run: ruff check .

      - name: Static type checking (MyPy)
        run: mypy server client scripts

      - name: Install PostgreSQL client utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Reset and seed test database
        run: bash scripts/reset_db.sh

      - name: Run database tests (Smoke test, Idempotent patch, Test seed)
        run: bash scripts/run_db_tests.sh

      - name: Run Pytest test suite (Unit, Integration, Architecture)
        run: pytest server/tests -v
