{% extends "_base/layout.html" %}

{% block title %}Quản lý Xuất kho (Outbound) - ABEST WMS{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Điều phối Xuất kho (Outbound)</h1>
      <p class="text-sm text-slate-500">Theo dõi đơn xuất, cấp phát FEFO/FIFO, soạn hàng và phát hành GI</p>
    </div>

    <form method="get" action="/outbound" class="flex items-center gap-2">
      <select name="status" class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white">
        <option value="" {% if not selected_status %}selected{% endif %}>Tất cả trạng thái</option>
        <option value="NEW" {% if selected_status == 'NEW' %}selected{% endif %}>Mới (NEW)</option>
        <option value="PICKING" {% if selected_status == 'PICKING' %}selected{% endif %}>Đang soạn (PICKING)</option>
        <option value="PICKED" {% if selected_status == 'PICKED' %}selected{% endif %}>Đã soạn (PICKED)</option>
        <option value="PACKING" {% if selected_status == 'PACKING' %}selected{% endif %}>Đang đóng gói (PACKING)</option>
        <option value="READY_TO_SHIP" {% if selected_status == 'READY_TO_SHIP' %}selected{% endif %}>Sẵn sàng xuất (READY_TO_SHIP)</option>
        <option value="SHIPPED" {% if selected_status == 'SHIPPED' %}selected{% endif %}>Đã xuất (SHIPPED)</option>
        <option value="CANCELLED" {% if selected_status == 'CANCELLED' %}selected{% endif %}>Đã hủy (CANCELLED)</option>
      </select>
      <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
        Lọc đơn
      </button>
    </form>
  </div>

  <div id="outbound-orders-container">
    {% include "outbound/_orders_table.html" %}
  </div>
</div>
{% endblock %}
