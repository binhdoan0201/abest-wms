{% extends "_base/layout.html" %}

{% block title %}Tổng Quan Kho | ABEST WMS{% endblock %}

{% block content %}
<div class="space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
        <div>
            <h1 class="text-xl sm:text-2xl font-black text-slate-800 tracking-tight">Bảng Điều Hành Kho</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-0.5">
                Task, tồn kho và đơn trong ngày. Tự làm mới mỗi 60 giây.
            </p>
        </div>
        <button hx-post="/dashboard/refresh"
                hx-target="#dashboard-panels"
                hx-swap="innerHTML"
                hx-indicator="#dash-indicator"
                class="w-full sm:w-auto bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-4 py-2.5 rounded-xl border border-indigo-200 text-xs sm:text-sm transition flex items-center justify-center gap-2 shadow-sm">
            <span id="dash-indicator" class="htmx-indicator animate-spin">🔄</span>
            <span>Làm mới</span>
        </button>
    </div>

    <div id="dashboard-panels"
         hx-post="/dashboard/refresh"
         hx-trigger="every 60s"
         hx-swap="innerHTML">
        {% include "dashboard/_panels.html" %}
    </div>
</div>
{% endblock %}
