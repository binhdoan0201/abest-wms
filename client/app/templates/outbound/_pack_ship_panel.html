<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm space-y-4">
  <h2 class="text-lg font-semibold text-slate-800">Khu vực Đóng gói & Xuất hàng GI (NV Đóng gói)</h2>
  {% if flash_msg %}<div class="rounded-lg border border-emerald-200 bg-emerald-50 p-3 text-sm text-emerald-800">{{ flash_msg }}</div>{% endif %}
  {% if api_error %}<div class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-800"><strong>[{{ api_error.code }}]</strong> {{ api_error.message }}</div>{% endif %}
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <form hx-post="/outbound/pack-and-ship" hx-target="#outbound-pack-container" hx-swap="innerHTML" class="rounded-lg border border-slate-200 p-3 space-y-2">
      <input type="hidden" name="action" value="package" />
      <div class="font-medium text-sm text-slate-700">1. Đóng gói kiện hàng</div>
      <input type="text" name="order_id" placeholder="UUID Đơn xuất kho" required class="w-full rounded border border-slate-300 px-2.5 py-1.5 text-xs" />
      <input type="text" name="weight_kg" value="2.5" placeholder="Khối lượng (kg)" required class="w-full rounded border border-slate-300 px-2.5 py-1.5 text-xs" />
      <button type="submit" class="w-full rounded bg-indigo-600 py-1.5 text-xs font-medium text-white hover:bg-indigo-700">Tạo kiện đóng gói</button>
    </form>
    <form hx-post="/outbound/pack-and-ship" hx-target="#outbound-pack-container" hx-swap="innerHTML" class="rounded-lg border border-slate-200 p-3 space-y-2">
      <input type="hidden" name="action" value="create_gi" />
      <div class="font-medium text-sm text-slate-700">2. Lập phiếu xuất kho GI</div>
      <input type="text" name="order_id" placeholder="UUID Đơn xuất kho" required class="w-full rounded border border-slate-300 px-2.5 py-1.5 text-xs" />
      <button type="submit" class="w-full rounded bg-blue-600 py-1.5 text-xs font-medium text-white hover:bg-blue-700">Lập phiếu GI</button>
    </form>
    <form hx-post="/outbound/pack-and-ship" hx-target="#outbound-pack-container" hx-swap="innerHTML" class="rounded-lg border border-slate-200 p-3 space-y-2">
      <input type="hidden" name="action" value="confirm_gi" />
      <div class="font-medium text-sm text-slate-700">3. Xác nhận giao hàng (SHIPPED)</div>
      <input type="text" name="gi_id" placeholder="UUID Phiếu GI" required class="w-full rounded border border-slate-300 px-2.5 py-1.5 text-xs" />
      <input type="text" name="driver_signature_data" value="SIGNED_BY_DRIVER" placeholder="Chữ ký tài xế" class="w-full rounded border border-slate-300 px-2.5 py-1.5 text-xs" />
      <button type="submit" class="w-full rounded bg-emerald-600 py-1.5 text-xs font-medium text-white hover:bg-emerald-700">Xác nhận xuất kho</button>
    </form>
  </div>
</div>
