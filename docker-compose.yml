services:
  db:
    image: postgres:16-alpine
    container_name: abest-wms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-abest_wms}
      POSTGRES_USER: ${DB_USER:-wms_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wms_secret_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wms_admin} -d ${DB_NAME:-abest_wms}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  pgdata:
